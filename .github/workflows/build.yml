name: Build TravelPins TEST

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Show debug SHA-1
        run: |
          gradle signingReport

  
      - name: Check Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "ERRORE: MAPS_API_KEY è vuota"
            exit 1
          else
            echo "OK: MAPS_API_KEY presente"
          fi

            - name: Build APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          gradle assembleDebug -PMAPS_API_KEY="$MAPS_API_KEY"
